query GetRepo($rid: ID!) {
  repository(rid: $rid) {
    id
    rid
    name
    description
    visibility
    owner {
      canonicalName
    }
  }
}

query GetManifests($username: String!, $repo_name: String!) {
  user(username: $username) {
    repository(name: $repo_name) {
      name
      visibility

      paths(paths:[".build.yml", ".build.yaml", ".builds"]) {
        object {
          __typename
          ... on Tree {
            entries {
              results {
                name
                object {
                  __typename
                  ... on TextBlob { text }
                }
              }
            }
          }
          ... on TextBlob {
            __typename
            text
          }
        }
      }
    }
  }
}

mutation CreateUserWebhook(
  $payload: String!
  $url: String!,
) {
  webhook: createUserWebhook(config: {
    url: $url,
    events: [
      REPO_UPDATE,
      REPO_DELETED,
    ],
    query: $payload
  }) { id }
}

mutation DeleteUserWebhook($id: Int!) {
  deleteUserWebhook(id: $id) { id }
}

mutation CreateRepoWebhook(
  $repoID: Int!,
  $payload: String!,
  $url: String!,
) {
  webhook: createGitWebhook(config: {
    repositoryID: $repoID,
    url: $url,
    query: $payload,
    events: [GIT_POST_RECEIVE],
  }) { id }
}

mutation DeleteRepoWebhook($id: Int!) {
  deleteGitWebhook(id: $id) { id }
}

# Versioned, see GIT_WEBHOOK_VERSION in api/graph/webhooks.go
query EventWebhook {
  webhook {
    __typename
    uuid
    event
    date

    ... on RepositoryEvent {
      repository {
        id
        rid
        name
        description
        visibility
      }
    }

    ... on GitEvent {
      repository {
        name
        owner {
          canonicalName
        }
      }
      pusher {
        __typename
        canonicalName

        ... on User {
          username
        }
      }

      updates {
        old {
          __typename
          id
        }

        new {
          __typename
          id
          shortId

          ... on Commit {
            message
          }
          ... on Tag {
            message
          }
        }

        log {
          results {
            id
            message
            author {
              name
            }
            trailers {
              name
              value
            }
          }
        }
      }
    }
  }
}
