query GetTracker($rid: ID!) {
  tracker(rid: $rid) {
    __typename
    ... trackerDetails
  }
}

fragment trackerDetails on Tracker {
  id
  rid
  name
  description
  visibility
  updated

  defaultACL {
    browse
  }

  owner {
    __typename
    canonicalName
  }
}

mutation CreateUserWebhook(
  $payload: String!
  $url: String!,
) {
  webhook: createUserWebhook(config: {
    url: $url,
    events: [
      TRACKER_UPDATE
      TRACKER_DELETED
    ],
    query: $payload
  }) { id }
}

mutation DeleteUserWebhook($id: Int!) {
  deleteUserWebhook(id: $id) { id }
}

mutation CreateTrackerWebhook(
  $trackerId: Int!,
  $payload: String!,
  $url: String!,
) {
  webhook: createTrackerWebhook(trackerId: $trackerId, config: {
    url: $url,
    events: [
      TICKET_CREATED,
      EVENT_CREATED,
    ],
    query: $payload,
  }) { id }
}

mutation DeleteTrackerWebhook($id: Int!) {
  deleteTrackerWebhook(id: $id) { id }
}

query GetTicketComments(
  $username: String!,
  $tracker: String!,
  $ticketId: Int!,
) {
  user(username: $username) {
    tracker(name: $tracker) {
      id
      rid

      ticket(id: $ticketId) {
        id

        events {
          results {
            changes {
              __typename
              ... on Comment {
                text
              }
            }
          }
        }
      }
    }
  }
}

mutation SubmitComment(
  $trackerId: Int!,
  $ticketId: Int!,
  $comment: SubmitCommentInput!
) {
  submitComment(
    trackerId: $trackerId,
    ticketId: $ticketId,
    input: $comment,
  ) { id }
}

# Versioned, see TODO_WEBHOOK_VERSION in api/graph/webhooks.go
query EventWebhook {
  webhook {
    __typename
    uuid
    event
    date

    ... on TrackerEvent {
      tracker {
        id
        rid
        name
        description
        visibility
      }
    }

    ... on TicketEvent {
      ticket {
        id
        subject

        tracker {
          id
          rid
          name
          owner {
            canonicalName
          }
        }

        submitter {
          __typename
          canonicalName

          ... on User {
            id
            username
          }

          ... on EmailAddress {
            mailbox
            name
          }

          ... on ExternalUser {
            externalId
            externalUrl
          }
        }
      }
    }

    ... on EventCreated {
      newEvent {
        ticket {
          id
          subject

          tracker {
            id
            rid
            name
            owner {
              canonicalName
            }
          }
        }

        changes {
          __typename
          eventType

          ... on Comment {
            author {
              __typename
              canonicalName

              ... on User {
                id
                username
              }

              ... on EmailAddress {
                mailbox
                name
              }

              ... on ExternalUser {
                externalId
                externalUrl
              }
            }
          }
        }
      }
    }
  }
}
