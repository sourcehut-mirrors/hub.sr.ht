query GetList($rid: ID!) {
  mailingList: list(rid: $rid) {
    ... listDetails
  }
}

fragment listDetails on MailingList {
  id
  rid
  name
  description
  visibility
  defaultACL {
    browse
  }
  owner {
    canonicalName
  }
}

mutation CreateUserWebhook(
  $payload: String!
  $url: String!,
) {
  webhook: createUserWebhook(config: {
    url: $url,
    events: [
      LIST_UPDATED,
      LIST_DELETED,
    ],
    query: $payload
  }) { id }
}

mutation DeleteUserWebhook($id: Int!) {
  deleteUserWebhook(id: $id) { id }
}

mutation CreateListWebhook(
  $listId: Int!,
  $url: String!,
  $payload: String!
) {
  webhook: createMailingListWebhook(
    listId: $listId,
    config: {
      url: $url,
      query: $payload,
      events: [
        EMAIL_RECEIVED,
        PATCHSET_RECEIVED,
      ],
    },
  ) { id }
}

mutation DeleteListWebhook($id: Int!) {
  deleteMailingListWebhook(id: $id) { id }
}

mutation CreateTool(
  $patchsetID: Int!,
  $details: String!,
  $icon: ToolIcon!,
) {
  createTool(patchsetID: $patchsetID, details: $details, icon: $icon) {
    id
  }
}

mutation UpdateTool(
  $toolID: Int!,
  $details: String!,
  $icon: ToolIcon!,
) {
  updateTool(id: $toolID, details: $details, icon: $icon) {
    id
  }
}

query GetPatchset($id: Int!) {
  patchset(id: $id) {
    id
    subject
    prefix
    list {
      name
      owner {
        canonicalName
      }
    }
  }
}

# Versioned, see LISTS_WEBHOOK_VERSION in api/graph/webhooks.go
query EventWebhook {
  webhook {
    __typename
    uuid
    event
    date

    ... on MailingListEvent {
      list {
        id
        rid
        name
        description
        visibility
      }
    }

    ... on EmailEvent {
      email {
        id
        list { id, name, owner { canonicalName } }
        messageID
        subject

        sender {
          __typename
          canonicalName

          ... on User {
            username
          }

          ... on Mailbox {
            name
          }
        }

        patch {
          trailers {
            name
            value
          }
        }

        patchset {
          id
        }
      }
    }

    ... on PatchsetEvent {
      patchset {
        id
        subject
        prefix
        version
        list { id, name, owner { canonicalName } }

        thread {
          root {
            messageID
            reply_to: header(want: "In-Reply-To")
          }
        }

        patches {
          results {
            subject
            messageID

            patchset {
              id
            }

            sender {
              __typename
              canonicalName

              ... on User {
                username
              }

              ... on Mailbox {
                name
              }
            }

            patch {
              prefix

              trailers {
                name
                value
              }
            }
          }
        }

        submitter {
          __typename
          canonicalName

          ... on User {
            username
            email
          }

          ... on Mailbox {
            name
            address
          }
        }
      }
    }
  }
}
